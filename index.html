<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no">
<title>Receipt Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --pink: #c2185b;
    --pink-dark: #9c1244;
    --gray: #757575;
    --border: #e0e0e0;
    --bg-light: #f8f9fa;
    --bg-gray: #e5e7eb;
    --text-main: #000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-light);
    color: var(--text-main);
    padding: 20px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .app-container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  
  /* Header */
  .app-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .app-header h1 { font-size: 24px; font-weight: 700; }
  .app-header p { font-size: 14px; color: var(--gray); }
  
  /* Template Pills */
  .template-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  .template-scroll::-webkit-scrollbar { display: none; }
  .pill {
    white-space: nowrap; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border);
    background: #fff; color: var(--text-main); font-family: inherit; font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
  }
  .pill:hover { border-color: var(--pink); color: var(--pink); }
  .pill.active { background: var(--pink); color: #fff; border-color: var(--pink); }

  /* Main Content */
  .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: flex-start; }
  
  /* Editor Panel */
  .editor-panel { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
  .editor-panel h2 { font-size: 18px; margin-bottom: 20px; font-weight: 700; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--gray); margin-bottom: 6px; text-transform: uppercase; }
  .form-group input {
    width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px;
    font-family: inherit; font-size: 15px; outline: none; color: #000;
  }
  .form-group input:focus { border-color: var(--pink); }
  .download-btn {
    width: 100%; background: var(--pink); color: #fff; border: none; border-radius: 8px; padding: 14px;
    font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 24px;
  }
  .download-btn:hover { background: var(--pink-dark); }

  /* Preview Panel */
  .preview-panel {
    display: flex; justify-content: center; background: var(--bg-gray);
    border-radius: 24px; padding: 40px 20px; min-height: 500px; position: relative;
  }
  
  /* Responsive */
  @media (max-width: 850px) {
    .main-content { grid-template-columns: 1fr; }
    .preview-panel { min-height: auto; }
  }
</style>
</head>
<body>

<div class="app-container">
  <header class="app-header">
    <div>
      <h1>Receipt Generator</h1>
      <p>Edit and download payment receipts</p>
    </div>
  </header>

  <!-- Template Buttons (Jab naya template aayega, yahan ek button add kar lenge) -->
  <div class="template-scroll">
    <button class="pill active" onclick="loadTemplate('t1.html', this)">bKash Received Money</button>
    <button class="pill" onclick="loadTemplate('t2.html', this)">bKash Send Money (Full)</button>
    <!-- Future templates will be added here -->
  </div>

  <div class="main-content">
    <!-- Editor Panel -->
    <div class="editor-panel">
      <h2>EDIT FIELDS</h2>
      <div class="form-group"><label>Account Number</label><input type="text" id="input-acc" value="01615856046" oninput="updatePreview()"></div>
      <div class="form-group"><label>Time</label><input type="text" id="input-time" value="12:18pm 03/05/26" oninput="updatePreview()"></div>
      <div class="form-group"><label>Amount</label><input type="text" id="input-amt" value="৳485.00" oninput="updatePreview()"></div>
      <div class="form-group"><label>Charge</label><input type="text" id="input-charge" value="৳0.00" oninput="updatePreview()"></div>
      <div class="form-group"><label>Transaction ID</label><input type="text" id="input-trxn" value="DE38R4P2YG" oninput="updatePreview()"></div>
      <div class="form-group"><label>Reference</label><input type="text" id="input-ref" value="" oninput="updatePreview()" placeholder="Add reference..."></div>
      <button class="download-btn" onclick="downloadReceipt()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Download Receipt (PNG)
      </button>
    </div>

    <!-- Preview Container (Yahan external file load hogi) -->
    <div class="preview-panel" id="preview-container">
      <div style="text-align:center; color: #888;">Loading template...</div>
    </div>
  </div>
</div>

<script>
  // Function to load external HTML file into the preview container
  async function loadTemplate(filename, btnElement) {
    // Update active button state
    document.querySelectorAll('.pill').forEach(pill => pill.classList.remove('active'));
    if (btnElement) btnElement.classList.add('active');

    const container = document.getElementById('preview-container');
    container.innerHTML = '<div style="text-align:center; color: #888; padding: 50px;">Loading...</div>';

    try {
      const response = await fetch(filename);
      if (!response.ok) throw new Error('File not found');
      const html = await response.text();
      container.innerHTML = html;
      
      // After loading, immediately update the preview with current field values
      updatePreview();
      
      // iOS Auto-link remover
      const phoneDivs = container.querySelectorAll('.phone-number-display');
      phoneDivs.forEach(div => {
        const links = div.querySelectorAll('a');
        links.forEach(link => link.replaceWith(link.innerText));
      });

    } catch (error) {
      container.innerHTML = '<div style="text-align:center; color: red; padding: 50px;">Error loading template. Make sure the file exists.</div>';
    }
  }

  // Update Preview Inputs dynamically
  function updatePreview() {
    const acc = document.getElementById('input-acc').value;
    const time = document.getElementById('input-time').value;
    const amt = document.getElementById('input-amt').value;
    const charge = document.getElementById('input-charge').value;
    const trxn = document.getElementById('input-trxn').value;
    const ref = document.getElementById('input-ref').value;

    // Mapping dictionary: Input ID -> Preview Element ID
    const mappings = {
      'p-acc': acc,
      'p-acc-sub': acc,
      'p-time': time,
      'p-amt': amt,
      'p-charge': charge,
      'p-trxn': trxn,
      'p-ref': ref
    };

    // Loop through mappings and update text if element exists
    for (const [previewId, value] of Object.entries(mappings)) {
      const el = document.getElementById(previewId);
      if (el) el.innerText = value;
    }
  }

  // Download Receipt Logic
  function downloadReceipt() {
    // Find the currently loaded template inside the container
    const activePreview = document.querySelector('#preview-container > div');
    if (!activePreview) return;

    const btn = document.querySelector('.download-btn');
    const originalText = btn.innerHTML;
    btn.innerHTML = 'Generating...';
    btn.disabled = true;

    html2canvas(activePreview, {
      scale: 2,
      backgroundColor: '#ffffff',
      useCORS: true
    }).then(canvas => {
      const link = document.createElement('a');
      const trxnId = document.getElementById('input-trxn').value || 'receipt';
      link.download = 'receipt-' + trxnId + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      btn.innerHTML = originalText;
      btn.disabled = false;
    }).catch(err => {
      console.error(err);
      alert('Failed to generate image.');
      btn.innerHTML = originalText;
      btn.disabled = false;
    });
  }

  // Load the first template on startup
  window.onload = () => loadTemplate('t1.html', document.querySelector('.pill'));
</script>
</body>
</html>
