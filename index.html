<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Success</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #e6007e;
    --pink-dark: #c2006a;
    --gray: #888;
    --border: #e5e5e5;
    /* --bg: #e0e0e0;  <-- Removed the grey background variable */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hind Siliguri', sans-serif;
    background: #ffffff; /* Changed to white so no grey background */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    overflow: hidden;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
  }
  .header-text {
    font-size: 16px;
    font-weight: 600;
    color: #000;
  }
  .pink { color: var(--pink); }
  .bold { font-weight: 700; }
  .check-circle {
    width: 36px;
    height: 36px;
    border: 2px solid #22c55e;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #22c55e;
  }
  .divider { border-top: 1px solid var(--border); }
  .phone-section {
    display: flex;
    align-items: center;
    padding: 16px 20px;
  }
  .avatar {
    width: 48px;
    height: 48px;
    background: #d9f0f7;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #00838f;
    font-size: 20px;
    font-weight: 600;
  }
  .phone-numbers {
    margin-left: 12px;
    font-size: 16px;
    line-height: 1.6;
    color: #000;
  }
  .call-btn {
    margin-left: auto;
    border: 1.5px solid var(--pink);
    color: var(--pink);
    background: transparent;
    border-radius: 999px;
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: 1px solid var(--border);
  }
  .grid-item {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .grid-item:nth-child(odd) {
    border-right: 1px solid var(--border);
  }
  .grid-item:nth-last-child(-n+2) {
    border-bottom: none;
  }
  .label {
    font-size: 12px;
    color: var(--gray);
    margin-bottom: 6px;
  }
  .value {
    font-size: 16px;
    font-weight: 500;
    color: #000;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .sub {
    font-size: 13px;
    color: var(--gray);
    margin-top: 4px;
  }
  .icon { width: 18px; height: 18px; flex-shrink: 0; }
  .icon-sm { width: 16px; height: 16px; }
  .reference {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .reference .label { margin-bottom: 0; }
  .actions {
    display: flex;
    gap: 12px;
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }
  .action-btn {
    flex: 1;
    border: 1.5px solid var(--pink);
    color: var(--pink);
    background: transparent;
    border-radius: 999px;
    padding: 12px 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }
  .reward {
    text-align: center;
    padding: 24px 20px;
  }
  .reward-circle {
    width: 56px;
    height: 56px;
    background: var(--pink);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
    color: #fff;
  }
  .reward-sub {
    font-size: 14px;
    color: var(--gray);
    margin-bottom: 4px;
  }
  .reward-title {
    font-size: 18px;
    font-weight: 700;
    color: #000;
    margin-bottom: 6px;
  }
  .reward-desc {
    font-size: 13px;
    color: #555;
  }
  .reward-desc a {
    color: var(--pink);
    text-decoration: underline;
    font-weight: 500;
  }
  .bottom-bar {
    background: var(--pink);
    color: #fff;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 16px;
    font-weight: 600;
  }
  .bottom-bar svg { width: 20px; height: 20px; }
</style>
</head>
<body>
  <div class="card">
    <!-- Header -->
    <div class="header">
      <div class="header-text">
        আপনার <span class="pink bold">সেন্ড মানি</span> সফল হয়েছে
      </div>
      <div class="check-circle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Phone Section -->
    <div class="phone-section">
      <div class="avatar">0</div>
      <div class="phone-numbers">
        <div>01615856046</div>
        <div>01615856046</div>
      </div>
      <button class="call-btn">
        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
        </svg>
        কল
      </button>
    </div>

    <div class="divider"></div>

    <!-- Grid -->
    <div class="grid">
      <div class="grid-item">
        <div class="label">সময়</div>
        <div class="value">12:03pm 03/05/26</div>
      </div>
      <div class="grid-item">
        <div class="label">ট্রানজেকশন আইডি</div>
        <div class="value">
          DE31R3ZP3X
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </div>
      </div>
      <div class="grid-item">
        <div class="label">সর্বমোট</div>
        <div class="value">৳305.00</div>
        <div class="sub">৳300.00 + ৳5.00</div>
      </div>
      <div class="grid-item">
        <div class="label">নতুন ব্যালেন্স</div>
        <div class="value">
          ৳200.10
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </div>
      </div>
    </div>

    <!-- Reference -->
    <div class="reference">
      <div class="label">রেফারেন্স</div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="action-btn">
        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
          <path d="M12 7v5l4 2"></path>
        </svg>
        অ্যাটো পে চালু করুন
      </button>
      <button class="action-btn">
        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
          <polyline points="16 6 12 2 8 6"></polyline>
          <line x1="12" y1="2" x2="12" y2="15"></line>
        </svg>
        শেয়ার
      </button>
    </div>

    <!-- Reward -->
    <div class="reward">
      <div class="reward-circle">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
      </div>
      <div class="reward-sub">আপনি অর্জন করছেন</div>
      <div class="reward-title">বিকাশ রিওয়ার্ড পয়েন্ট</div>
      <div class="reward-desc">
        পয়েন্ট ব্যবহার করতে <a href="#">বিকাশ রিওয়ার্ডস</a> চেক করুন!
      </div>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
      <span>হোম-এ ফিরে যাই</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </div>
  </div>
</body>
</html>
