<!-- t1.html -->
<!-- 1. Is Template ka Form (Edit Fields) -->
<div class="template-form">
  <div class="form-group">
    <label>Account</label>
    <input type="text" data-preview-target="t1-acc" value="01615856046">
  </div>
  <div class="form-group">
    <label>Time</label>
    <input type="text" data-preview-target="t1-time" value="12:18pm 03/05/26">
  </div>
  <div class="form-group">
    <label>Amount</label>
    <input type="text" data-preview-target="t1-amt" value="৳485.00">
  </div>
  <div class="form-group">
    <label>Charge</label>
    <input type="text" data-preview-target="t1-charge" value="৳0.00">
  </div>
  <div class="form-group">
    <label>Transaction ID</label>
    <input type="text" data-preview-target="t1-trxn" value="DE38R4P2YG">
  </div>
  <div class="form-group">
    <label>Reference</label>
    <input type="text" data-preview-target="t1-ref" value="" placeholder="Add reference...">
  </div>
</div>

<!-- 2. Is Template ka Preview (Exact Design) -->
<div class="template-preview" style="background:#ffffff; border-radius:16px; box-shadow: 0 8px 30px rgba(0,0,0,0.06); overflow:hidden; width:100%; max-width:400px; margin: 0 auto; font-family: 'Inter', 'Hind Siliguri', sans-serif;">
  
  <!-- Header -->
  <div style="display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid #E5E7EB;">
    <h3 style="font-size:18px; font-weight:700; color:#111827; margin:0;">Received Money</h3>
    <button style="color:#C2185B; font-size:16px; font-weight:600; background:none; border:none; font-family:inherit; cursor:pointer;">Close</button>
  </div>

  <!-- Grid Layout -->
  <div style="display:grid; grid-template-columns:1fr 1fr;">
    
    <!-- Row 1 -->
    <div style="padding:16px 24px; border-bottom:1px solid #E5E7EB; border-right:1px solid #E5E7EB;">
      <div style="font-size:12px; color:#6B7280; margin-bottom:6px; font-weight:500;">Account</div>
      <div id="t1-acc" style="font-size:16px; font-weight:500; color:#111827;">01615856046</div>
    </div>
    <div style="padding:16px 24px; border-bottom:1px solid #E5E7EB;">
      <div style="font-size:12px; color:#6B7280; margin-bottom:6px; font-weight:500;">Time</div>
      <div id="t1-time" style="font-size:16px; font-weight:500; color:#111827;">12:18pm 03/05/26</div>
    </div>

    <!-- Row 2 -->
    <div style="padding:16px 24px; border-bottom:1px solid #E5E7EB; border-right:1px solid #E5E7EB;">
      <div style="font-size:12px; color:#6B7280; margin-bottom:6px; font-weight:500;">Amount</div>
      <div id="t1-amt" style="font-size:16px; font-weight:500; color:#111827;">৳485.00</div>
    </div>
    <div style="padding:16px 24px; border-bottom:1px solid #E5E7EB;">
      <div style="font-size:12px; color:#6B7280; margin-bottom:6px; font-weight:500;">Charge</div>
      <div id="t1-charge" style="font-size:16px; font-weight:500; color:#111827;">৳0.00</div>
    </div>

    <!-- Row 3 -->
    <div style="padding:16px 24px; border-bottom:1px solid #E5E7EB; border-right:1px solid #E5E7EB;">
      <div style="font-size:12px; color:#6B7280; margin-bottom:6px; font-weight:500;">Transaction ID</div>
      <div style="display:flex; align-items:center; gap:6px;">
        <span id="t1-trxn" style="font-size:16px; font-weight:500; color:#111827;">DE38R4P2YG</span>
        <!-- Copy Icon -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      </div>
    </div>
    <div style="padding:16px 24px; border-bottom:1px solid #E5E7EB;">
      <div style="font-size:12px; color:#6B7280; margin-bottom:6px; font-weight:500;">Reference</div>
      <div id="t1-ref" style="font-size:16px; font-weight:500; color:#111827; min-height:20px;"></div>
    </div>

  </div>

  <!-- Actions -->
  <div style="display:flex; gap:12px; padding:20px 24px;">
    
    <!-- Send Money Button -->
    <button style="flex:1; border:2px solid #C2185B; color:#C2185B; background:transparent; border-radius:999px; padding:12px 8px; font-size:15px; font-weight:600; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
      Send Money
    </button>

    <!-- Share Button -->
    <button style="flex:1; border:2px solid #C2185B; color:#C2185B; background:transparent; border-radius:999px; padding:12px 8px; font-size:15px; font-weight:600; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
      Share
    </button>
    
  </div>
</div>
