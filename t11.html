<!-- t11.html -->
<!-- 1. Is Template ka Form (Edit Fields) -->
<div class="template-form">
  <div class="form-group">
    <label>ACCOUNT NO (একাউন্ট নং)</label>
    <input type="text" data-preview-target="t11-acc" value="01610063819">
  </div>
  <div class="form-group">
    <label>AMOUNT (পরিমাণ)</label>
    <input type="text" data-preview-target="t11-amt" value="2,950 টাকা">
  </div>
  <div class="form-group">
    <label>TRANSACTION ID (ট্রানজেকশন আইডি)</label>
    <input type="text" data-preview-target="t11-trxid" value="759G23JS">
  </div>
  <div class="form-group">
    <label>DATE & TIME (দিন ও সময়)</label>
    <input type="text" data-preview-target="t11-datetime" value="আজ, 11:06 AM">
  </div>
</div>

<!-- 2. Is Template ka Preview (Exact Nagad Cash In Design) -->
<div class="template-preview" id="receipt-download" style="background-color: #f3f4f6; width: 100%; max-width: 400px; border-radius: 20px; padding: 0; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; margin: 0 auto;">

  <div style="background-color: #E88B31; padding: 24px 20px; display: flex; flex-direction: column; align-items: center; position: relative;">
    
    <!-- Close Button (X) -->
    <div style="position: absolute; top: 16px; right: 16px; width: 28px; height: 28px; background: rgba(255,255,255,0.25); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </div>

    <!-- Cash In Icon -->

  </div>

  <!-- Body Section (White Background) -->
  <div style="background: #ffffff; display: flex; flex-direction: column; width: 100%;">
    
    <!-- Row 1: Account No -->
    <div style="display: flex; flex-direction: column; align-items: center; padding: 18px 20px; border-bottom: 1px solid #f3f4f6;">
      <div style="font-size: 13px; color: #9CA3AF; font-weight: 500; margin-bottom: 6px;">একাউন্ট নং</div>
      <div id="t11-acc" style="font-size: 20px; font-weight: 700; color: #111827; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">01610063819</div>
    </div>

    <!-- Row 2: Amount -->
    <div style="display: flex; flex-direction: column; align-items: center; padding: 18px 20px; border-bottom: 1px solid #f3f4f6;">
      <div style="font-size: 13px; color: #9CA3AF; font-weight: 500; margin-bottom: 6px;">পরিমাণ</div>
      <div id="t11-amt" style="font-size: 20px; font-weight: 700; color: #111827; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">2,950 টাকা</div>
    </div>

    <!-- Row 3: Transaction ID -->
    <div style="display: flex; flex-direction: column; align-items: center; padding: 18px 20px; border-bottom: 1px solid #f3f4f6;">
      <div style="font-size: 13px; color: #9CA3AF; font-weight: 500; margin-bottom: 6px;">ট্রানজেকশন আইডি</div>
      <div id="t11-trxid" style="font-size: 20px; font-weight: 700; color: #111827; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">759G23JS</div>
    </div>

    <!-- Row 4: Date & Time -->
    <div style="display: flex; flex-direction: column; align-items: center; padding: 18px 20px; border-bottom: 1px solid #f3f4f6;">
      <div style="font-size: 13px; color: #9CA3AF; font-weight: 500; margin-bottom: 6px;">দিন ও সময়</div>
      <div id="t11-datetime" style="font-size: 20px; font-weight: 700; color: #111827; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">আজ, 11:06 AM</div>
    </div>

  </div>

  <!-- Footer Section (Call & SMS) -->
  <div style="background: #ffffff; display: flex; justify-content: space-between; align-items: center; padding: 16px 24px 20px 24px; border-top: 1px solid #f3f4f6;">

    <button style="display: flex; align-items: center; gap: 8px; background: none; border: none; font-family: 'Hind Siliguri', sans-serif; font-size: 16px; font-weight: 600; color: #E88B31; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E88B31" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
      কল

    <!-- SMS Button -->
    <button style="display: flex; align-items: center; gap: 8px; background: none; border: none; font-family: 'Hind Siliguri', sans-serif; font-size: 16px; font-weight: 600; color: #E88B31; cursor: pointer;">
      এসএমএস
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E88B31" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>

</div>
