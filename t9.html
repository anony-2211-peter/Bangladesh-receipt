      <span style="font-size: 15px; color: #6b7280; font-weight: 500;">ট্রানজেকশন আইডি</span>
      <span id="t9-trxid" style="font-size: 15px; color: #111827; font-weight: 600;">759SB5RM</span>

      <span id="t9-time" style="font-size: 15px; color: #111827; font-weight: 600;">27 এপ্রি. 2026, 05:19 PM</span>
