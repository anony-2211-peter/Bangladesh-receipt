<!-- t4.html -->
<!-- 1. Is Template ka Form (Edit Fields) -->
<div class="template-form">
  <div class="form-group">
    <label>ACCOUNT (একাউন্ট)</label>
    <input type="text" data-preview-target="t4-acc" value="01914617898">
  </div>
  <div class="form-group">
    <label>TIME (সময়)</label>
    <input type="text" data-preview-target="t4-time" value="11:12am 28/04/26">
  </div>
  <div class="form-group">
    <label>AMOUNT (পরিমাণ)</label>
    <input type="text" data-preview-target="t4-amt" value="৳250.00">
  </div>
  <div class="form-group">
    <label>CHARGE (চার্জ)</label>
    <input type="text" data-preview-target="t4-charge" value="৳5.00">
  </div>
  <div class="form-group">
    <label>TRANSACTION ID (ট্রানজেকশন আইডি)</label>
    <input type="text" data-preview-target="t4-trxn" value="DDS0LEPNTS">
  </div>
  <div class="form-group">
    <label>REFERENCE (রেফারেন্স)</label>
    <input type="text" data-preview-target="t4-ref" value="" placeholder="Add reference...">
  </div>
</div>

<!-- 2. Is Template ka Preview (Exact Design) -->
<div class="template-preview" style="background:#ffffff; border-radius:16px; box-shadow: 0 8px 30px rgba(0,0,0,0.06); overflow:hidden; width:100%; max-width:400px; margin: 0 auto; font-family: 'Inter', 'Hind Siliguri', sans-serif; display: flex; flex-direction: column; box-sizing: border-box;">
  
  <!-- Header -->
  <div style="display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid #E5E7EB;">
    <h3 style="font-size:18px; font-weight:700; color:#111827; margin:0;">সেন্ড মানি</h3>
    <button style="color:#C2185B; font-size:16px; font-weight:600; background:none; border:none; font-family:inherit; cursor:pointer;">বন্ধ</button>
  </div>

  <!-- Grid Layout -->
  <div style="display:grid; grid-template-columns:1fr 1fr;">
    
    <!-- Row 1 -->
    <div style="padding:16px 24px; border-bottom:1px solid #E5E7EB; border-right:1px solid #E5E7EB;">
      <div style="font-size:12px; color:#6B7280; margin-bottom:6px; font-weight:500;">একাউন্ট</div>
      <div id="t4-acc" style="font-size:16px; font-weight:500; color:#111827;">01914617898</div>
    </div>
    <div style="padding:16px 24px; border-bottom:1px solid #E5E7EB;">
      <div style="font-size:12px; color:#6B7280; margin-bottom:6px; font-weight:500;">সময়</div>
      <div id="t4-time" style="font-size:16px; font-weight:500; color:#111827;">11:12am 28/04/26</div>
    </div>

    <!-- Row 2 -->
    <div style="padding:16px 24px; border-bottom:1px solid #E5E7EB; border-right:1px solid #E5E7EB;">
      <div style="font-size:12px; color:#6B7280; margin-bottom:6px; font-weight:500;">পরিমাণ</div>
      <div id="t4-amt" style="font-size:16px; font-weight:500; color:#111827;">৳250.00</div>
    </div>
    <div style="padding:16px 24px; border-bottom:1px solid #E5E7EB;">
      <div style="font-size:12px; color:#6B7280; margin-bottom:6px; font-weight:500;">চার্জ</div>
      <div id="t4-charge" style="font-size:16px; font-weight:500; color:#111827;">৳5.00</div>
    </div>

    <!-- Row 3 -->
    <div style="padding:16px 24px; border-bottom:1px solid #E5E7EB; border-right:1px solid #E5E7EB;">
      <div style="font-size:12px; color:#6B7280; margin-bottom:6px; font-weight:500;">ট্রানজেকশন আইডি</div>
      <div style="display:flex; align-items:center; gap:6px;">
        <span id="t4-trxn" style="font-size:16px; font-weight:500; color:#111827;">DDS0LEPNTS</span>
        <!-- Copy Icon -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      </div>
    </div>
    <div style="padding:16px 24px; border-bottom:1px solid #E5E7EB;">
      <div style="font-size:12px; color:#6B7280; margin-bottom:6px; font-weight:500;">রেফারেন্স</div>
      <div id="t4-ref" style="font-size:16px; font-weight:500; color:#111827; min-height:20px;"></div>
    </div>

  </div>

  <!-- Actions (Pill Buttons) -->
  <div style="display:flex; gap:12px; padding:20px 24px;">
    
    <!-- Send Money Button -->
    <button style="flex:1; border:1.5px solid #C2185B; color:#C2185B; background:transparent; border-radius:999px; padding:12px 8px; font-size:15px; font-weight:600; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
      সেন্ড মানি
    </button>

    <!-- Share Button -->
    <button style="flex:1; border:1.5px solid #C2185B; color:#C2185B; background:transparent; border-radius:999px; padding:12px 8px; font-size:15px; font-weight:600; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
      শেয়ার
    </button>
    
  </div>
</div>
